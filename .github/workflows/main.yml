name: learning_hub

on:
  push:
    branches: [production]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Deploy
        run: |
          cd /Users/admin/learning_hub

          git fetch origin
          git reset --hard origin/production

          npm install
          npm run build

          npm reload learning_hub || npm run start ecosystem.config.js
